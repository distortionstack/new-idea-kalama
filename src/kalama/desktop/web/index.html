function optionsPanel(){let o=optionRows();return `<section class="options-panel"><div class="row"><div><h3>ตัวเลือกของโมดูล</h3><span class="muted">${o.relevant} รายการที่จำเป็นหรือมีการแก้ไข · ทั้งหมด ${o.total} รายการ</span></div><div><button data-options-mode="priority" class="${optionsMode==='priority'?'active':''}">สำคัญ</button> <button data-options-mode="all" class="${optionsMode==='all'?'active':''}">ค้นหาทั้งหมด</button></div></div>${optionsMode==='all'?`<label>ค้นหาชื่อ option<input id="option-search" value="${esc(optionsQuery)}" placeholder="เช่น HTTP, SSL, Timeout"></label>`:''}<div id="option-results">${optionResults()}</div></section>`}
function optionResults(){const o=optionRows();const rows=o.shown.slice(0,optionsLimit);return rows.length?`${rows.map(([name,opt])=>`<label class="option-item">${esc(name)}${opt.required?' · จำเป็น':''}${/command|(^|::)cmd$/i.test(name)?`<textarea data-option="${esc(name)}" rows="5">${esc(value(opt))}</textarea>`:`<input data-option="${esc(name)}" value="${esc(value(opt))}" placeholder="${esc(opt.type)}">`}<small>${esc(opt.type)} · แนะนำ ${esc(opt.suggested??'ไม่มี')}</small></label>`).join('')}${o.shown.length>optionsLimit?`<button id="more-options">แสดงเพิ่ม (${o.shown.length-optionsLimit} รายการ)</button>`:''}`:'<p class="muted">ไม่มีรายการที่ตรงกับการค้นหา</p>'}
function attackForm(){const c=item();return `<div class="row"><div><h3>AttackForm · ${esc(cveKey)}</h3><span class="muted">ข้อมูลตัวอย่างจาก repo · ${esc(targets[targetIndex].source)} · revision ${attack.revision||1}</span></div><button id="attack-yaml">ดู YAML</button></div><div class="notice">ค่าที่แนะนำยังไม่ใช่ค่าที่ยืนยัน ช่องที่ต้องยืนยันจะถูกบันทึกใน <code>confirmed</code></div><div class="form-grid"><section><h3>โมดูลและเป้าหมาย</h3><label>Metasploit module<select data-edit="module.confirmed">${(c.module.candidates||[{module_path:value(c.module),module_source:'จากฟอร์ม'}]).map(x=>`<option value="${esc(x.module_path)}" ${value(c.module)===x.module_path?'selected':''}>${esc(x.module_path)} · ${x.module_source}</option>`).join('')}</select><small>แนะนำ: ${esc(c.module.suggested)}</small></label><label>รูปแบบเป้าหมาย<select id="target-name"><option value="${esc(value(c.target.index))}">${esc(value(c.target.name)||'ยังไม่มีชื่อเป้าหมาย')}</option></select><small>ชื่อจากโมดูล · ระบบเก็บ Target index ให้</small></label>${edit('targeturi.confirmed','TARGETURI',c.targeturi)}${edit('environment.rport.confirmed','RPORT',c.environment.rport,'number')}${c.module_options?.DOMAIN?edit('module_options.DOMAIN.confirmed','DOMAIN',c.module_options.DOMAIN):''}</section><section><h3>ตำแหน่งเป้าหมายและ Payload</h3><label>RHOSTS<input value="${esc(value(c.environment.rhosts))}" disabled><small>ยืนยันอัตโนมัติจากเป้าหมาย · อ่านอย่างเดียว</small></label>${c.environment.lhost?edit('environment.lhost.confirmed','LHOST (เครือข่าย Lab)',c.environment.lhost):''}<label>วิธีทดสอบ<select data-edit="execution_protocol.mode"><option value="check-only" ${c.execution_protocol.mode==='check-only'?'selected':''}>Check only</option><option value="check-then-exploit" ${c.execution_protocol.mode==='check-then-exploit'?'selected':''}>Check แล้วทดสอบใน Lab</option></select></label><label>Payload<select data-edit="payload.confirmed"><option value="">ยังไม่เลือก</option>${(c.payload.compatible||[]).map(x=>`<option value="${esc(x)}" ${c.payload.confirmed===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label>${c.payload?.confirmed?.includes('reverse')?edit('payload_options.LPORT.confirmed','Payload LPORT',c.payload_options?.LPORT||{suggested:4444},'number','เฉพาะ payload ที่ใช้ listener'):''}</section></div><section class="prepare-panel"><h3>คำสั่งเตรียมก่อนโจมตี</h3><label>Prepare command<textarea data-edit="pre_attack.command" rows="7" placeholder="ระบุคำสั่งเตรียมสภาพแวดล้อมก่อนทดสอบ (ถ้ามี)">${esc(c.pre_attack?.command??'')}</textarea></label><label>รันคำสั่งที่<input data-edit="pre_attack.execution_target" value="${esc(c.pre_attack?.execution_target??'')}" placeholder="ระบุ execution target ตามฟอร์ม"></label></section>${optionsPanel()}${drawerHtml('attack')}`}
function patchForm(){const a=action();return `<div class="row"><div><h3>PatchForm · ${esc(targets[targetIndex].patchMap[cveKey])}</h3><span class="muted">${esc(a.package.name)} · ${esc(a.package.before_versions.join(', '))} → เลือกเวอร์ชันเป้าหมาย</span></div><button id="patch-yaml">ดู YAML</button></div><div class="notice">Scanner เสนอ ${esc(a.package.scanner_fixed_versions.join(' หรือ '))} · ต้องตรวจแหล่งที่มาและความพร้อมก่อนยืนยัน</div><div class="form-grid"><section><h3>เวอร์ชันและแนวทาง</h3>${edit('patch.target_version.confirmed','Target version',a.target_version)}<label>Fix type<select data-patch="fix_type.confirmed"><option value="" ${a.fix_type.confirmed==null?'selected':''}>ยังไม่ยืนยัน</option>${[['A','สร้างซอฟต์แวร์จาก Source'],['B','ใช้ Prebuilt Image'],['C','อัปเดต OS Package']].map(([v,l])=>`<option value="${v}" ${a.fix_type.confirmed===v?'selected':''}>${v} — ${l}</option>`).join('')}</select><small>แนะนำ: ${esc(a.fix_type.suggested??'ไม่มี')} · ประเภทของการแก้ไขตามระบบ</small></label><label>Strategy<input data-patch="strategy.confirmed" value="${esc(a.strategy.confirmed??'')}" placeholder="${esc(a.strategy.suggested)}"><small>แนะนำ: ${esc(a.strategy.suggested)}</small></label></section><section><h3>ข้อมูลที่ต้องเติม</h3><label>แหล่ง Prebuilt Image หรือ Artifact<input data-patch="artifact.confirmed_source" value="${esc(a.artifact.confirmed_source??'')}" placeholder="ระบุแหล่งที่ตรวจสอบแล้ว"></label><label>Checksum ของ Artifact<input data-patch="artifact.checksum.confirmed" value="${esc(a.artifact.checksum.confirmed??'')}" placeholder="ถ้ามี"></label><label>คำสั่งแก้ไข (กรณีจำเป็น)<textarea data-patch="command.confirmed" rows="8" placeholder="ระบุคำสั่งแก้ไข หลายบรรทัดได้">${esc(a.command.confirmed??'')}</textarea></label><label>คำสั่งตรวจสอบผล<textarea data-patch="validation_command.confirmed" rows="6" placeholder="ระบุคำสั่งตรวจสอบผล หลายบรรทัดได้">${esc(a.validation_command.confirmed??'')}</textarea></label></section></div><div class="row"><span class="muted">Execution target: ${esc(a.execution_target)}</span><button id="confirm" class="main-action" ${completed[completedKey()]?'disabled':''}>${completed[completedKey()]?'ยืนยันแล้ว':'ยืนยันแนวทางและจำลองการแก้ไข'}</button></div>${drawerHtml('patch')}`}
function drawerHtml(kind){if(kind==='attack'&&!attackDrawer||kind==='patch'&&!patchDrawer)return '';let data=kind==='attack'?attack:patch;let draft=kind==='attack'?attackDraft:patchDraft;return `<div class="yaml-drawer"><div class="row"><h3>${kind==='attack'?'AttackForm':'PatchForm'} YAML</h3><button id="close-${kind}">ปิด</button></div><textarea id="${kind}-editor" spellcheck="false" aria-label="YAML" style="width:100%;height:280px;font:13px/1.5 monospace;background:var(--bg);color:var(--ink)">${esc(draft)}</textarea><p id="form-feedback" role="status">${esc(formError||'แก้ YAML แล้วกดตรวจและนำไปใช้')}</p><button id="apply-${kind}" class="main-action">ตรวจและนำไปใช้</button></div>`}
function detail(){if(tab==='ช่องโหว่')return `<h3>ช่องโหว่ของ ${esc(targets[targetIndex].name)}</h3><div class="scroll"><table><thead><tr><th>CVE</th><th>Package</th><th>เวอร์ชัน</th><th>การดำเนินการ</th></tr></thead><tbody>${targets[targetIndex].caseCves.map(id=>{let act=patch.actions[targets[targetIndex].patchMap[id]];return `<tr><td>${esc(id)}</td><td>${esc(act.package.name)}</td><td>${esc(act.package.before_versions.join(', '))}</td><td><button data-cve="${id}">เปิด AttackForm</button></td></tr>`}).join('')}</tbody></table></div><p class="foot">ตัวอย่างฟอร์มจาก ${esc(targets[targetIndex].source)} ใน repo</p>`;if(tab==='การสแกน'||tab==='การสแกนซ้ำ')return scanSummary();if(tab==='การทดสอบ')return phaseMeter('attack')+cvePicker()+attackForm();if(tab==='การอัปเดต')return phaseMeter('patch')+cvePicker()+patchForm();if(tab==='ทดสอบซ้ำ')return phaseMeter('retest')+(completed[completedKey()]?`<h3>ผลตรวจสอบซ้ำจำลอง</h3><p>ก่อน: EXPLOIT_SUCCEEDED · หลัง: NOT_REPRODUCED</p><p class="muted">ผลนี้เป็นภาพประกอบ UI เท่านั้น ยังไม่ได้รันเครื่องมือ</p>`:`<h3>ยังไม่ได้แก้ไข</h3><button data-tab="การอัปเดต">เปิด PatchForm</button>`);return `<h3>บันทึกการทำงาน</h3><p>ตัวอย่างสถานะการสแกน การตรวจสอบฟอร์ม และการยืนยัน</p>`}
function setPath(obj,path,val){let parts=path.split('.');for(let i=0;i<parts.length-1;i++)obj=obj[parts[i]]??(obj[parts[i]]={});obj[parts.at(-1)]=val}
function parseForm(kind,draft){if(!window.jsyaml)throw Error('YAML parser ยังไม่พร้อม');let obj=window.jsyaml.load(draft);if(!obj||obj.schema!==`kalama.${kind}-form/v1`)throw Error('schema ของฟอร์มไม่ตรง');if(kind==='attack'){let c=obj.cves?.[cveKey];if(!c?.module||!c?.environment?.rhosts||!c?.execution_protocol)throw Error('AttackForm ขาดข้อมูลจำเป็น');}else if(!obj.actions?.[targets[targetIndex].patchMap[cveKey]]?.package)throw Error('PatchForm ขาดข้อมูลจำเป็น');return obj}

root.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.openRun!==undefined){targets[targetIndex].attack=attack;targets[targetIndex].patch=patch;targetIndex=Number(b.dataset.openRun);attack=targets[targetIndex].attack;patch=targets[targetIndex].patch;cveKey=targets[targetIndex].caseCves[0];tab='ช่องโหว่';page='detail';render();return}if(b.dataset.selectCve){cveKey=b.dataset.selectCve;render();return}if(b.id==='llm-check'){llm.checked=true;llm.enabled=false;render();return}if(b.dataset.optionsMode){optionsMode=b.dataset.optionsMode;optionsLimit=10;render();return}if(b.id==='more-options'){optionsLimit+=10;root.querySelector('#option-results').innerHTML=optionResults();return}if(b.dataset.target!==undefined){targets[targetIndex].attack=attack;targets[targetIndex].patch=patch;targetIndex=Number(b.dataset.target);attack=targets[targetIndex].attack;patch=targets[targetIndex].patch;cveKey=targets[targetIndex].caseCves[0];optionsMode='priority';optionsQuery='';optionsLimit=10;attackDrawer=false;patchDrawer=false;tab='ช่องโหว่';render();return}if(b.dataset.cve){cveKey=b.dataset.cve;optionsMode='priority';optionsQuery='';optionsLimit=10;tab='การทดสอบ';render();return}if(b.dataset.page){page=b.dataset.page;render();return}if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.id==='attack-yaml'||b.id==='patch-yaml'){let kind=b.id.split('-')[0];if(kind==='attack'){attackDrawer=true;attackDraft=window.jsyaml?.dump(attack)||''}else{patchDrawer=true;patchDraft=window.jsyaml?.dump(patch)||''}formError='';render();return}if(b.id==='close-attack'||b.id==='close-patch'){attackDrawer=false;patchDrawer=false;render();return}if(b.id==='apply-attack'||b.id==='apply-patch'){let kind=b.id.split('-')[1];try{let updated=parseForm(kind,kind==='attack'?attackDraft:patchDraft);if(kind==='attack'){attack=updated;targets[targetIndex].attack=updated}else{patch=updated;targets[targetIndex].patch=updated}formError='ตรวจสอบผ่าน · ค่าบนฟอร์มอัปเดตแล้ว';render()}catch(err){root.querySelector('#form-feedback').textContent=err.message}return}if(b.id==='confirm'){completed[completedKey()]=true;tab='ทดสอบซ้ำ';render()}});
root.addEventListener('input',e=>{let el=e.target;if(el.id==='option-search'){optionsQuery=el.value;optionsLimit=10;root.querySelector('#option-results').innerHTML=optionResults();return}if(el.id==='attack-editor'){attackDraft=el.value;try{parseForm('attack',attackDraft);root.querySelector('#form-feedback').textContent='✓ โครงฟอร์มผ่าน'}catch(err){root.querySelector('#form-feedback').textContent=err.message}return}if(el.id==='patch-editor'){patchDraft=el.value;try{parseForm('patch',patchDraft);root.querySelector('#form-feedback').textContent='✓ โครงฟอร์มผ่าน'}catch(err){root.querySelector('#form-feedback').textContent=err.message}return}if(el.dataset.edit){let path=el.dataset.edit,val=el.type==='number'?Number(el.value):el.value;if(path.startsWith('patch.'))setPath(action(),path.slice(6),val);else setPath(item(),path,val);return}if(el.dataset.patch){setPath(action(),el.dataset.patch,el.value||null);return}if(el.dataset.option){item().module_options[el.dataset.option].confirmed=el.value||null;return}const map={'llm-url':'url','llm-model':'model','llm-key':'key'};if(!map[el.id])return;llm[map[el.id]]=el.value.trim();llm.checked=false;llm.enabled=false;const toggle=root.querySelector('#llm-toggle');toggle.checked=false;toggle.disabled=true;let valid=false;try{const u=new URL(llm.url);valid=['https:','http:'].includes(u.protocol)}catch{}root.querySelector('#llm-check').disabled=!(valid&&llm.model&&llm.key);root.querySelector('#llm-status').textContent='ยังไม่ตรวจสอบ · ตรวจสอบใหม่หลังเปลี่ยนข้อมูล';});
root.addEventListener('change',e=>{if(e.target.id==='target-name'){item().target.index.confirmed=Number(e.target.value);item().target.name.confirmed=value(item().target.name);}if(e.target.dataset.patch&&e.target.tagName==='SELECT'){setPath(action(),e.target.dataset.patch,e.target.value||null);}if(e.target.dataset.edit&&e.target.tagName==='SELECT'){setPath(item(),e.target.dataset.edit,e.target.value);}if(e.target.id==='llm-toggle'){llm.enabled=llm.checked&&e.target.checked;root.querySelector('#llm-status').textContent='ตรวจสอบผ่าน (จำลอง) · '+(llm.enabled?'เปิดใช้งานแล้ว':'ปิดใช้งาน');}if(e.target.name==='source'){const field=root.querySelector('#source-field');field.innerHTML=e.target.value==='ไฟล์ Image (.tar)'?'ไฟล์ Image<input name="image" type="file" accept=".tar" required>':'ชื่อ Image และ Tag<input name="image" required placeholder="เช่น lab/struts:demo">';}});

/* The visual structure above is the supplied prototype. This adapter replaces
   only its local sample records and submission actions with desktop bridge data. */
let attackContext=null,patchContext=null;
const bridge=()=>window.pywebview&&window.pywebview.api;
/* Keep the supplied components intact, but make incomplete real runs safe to
   open while their next form has not been generated by the pipeline yet. */
imageDone=t=>t.caseCves.length>0&&t.caseCves.every(id=>completed[targets.indexOf(t)+':'+id]);
const prototypeJobCards=jobCards;
jobCards=()=>targets.length?prototypeJobCards():'<p class="muted">ยังไม่มีงานที่บันทึกไว้ เริ่มวิเคราะห์ Image ใหม่เพื่อสร้างรายการงาน</p>';
const prototypeDetail=detail;
detail=()=>{const target=targets[targetIndex];if(!target?.caseCves?.length)return '<h3>ยังไม่มีฟอร์มให้ดำเนินการ</h3><p class="muted">งานนี้กำลังรอผลจากขั้นตอนก่อนหน้า</p>';if((tab==='ช่องโหว่'||tab==='การสแกน'||tab==='การสแกนซ้ำ')&&target.caseCves.some(id=>!patch.actions[target.patchMap[id]])){if(tab!=='ช่องโหว่')return '<h3>'+esc(tab)+'</h3><p class="muted">ยังไม่มีผล PatchPlan สำหรับรายการนี้</p>';return '<h3>ช่องโหว่ของ '+esc(target.name)+'</h3><div class="scroll"><table><thead><tr><th>CVE</th><th>Package</th><th>เวอร์ชัน</th><th>การดำเนินการ</th></tr></thead><tbody>'+target.caseCves.map(id=>'<tr><td>'+esc(id)+'</td><td>รอ PatchPlan</td><td>—</td><td><button data-cve="'+esc(id)+'">เปิด AttackForm</button></td></tr>').join('')+'</tbody></table></div><p class="foot">ข้อมูลจาก Run '+esc(target.attack.run_id||target.name)+'</p>';}if(tab==='การอัปเดต'&&!action())return '<h3>ยังไม่มี PatchForm</h3><p class="muted">PatchForm จะพร้อมหลังระบบสร้าง PatchPlan สำหรับช่องโหว่นี้</p>';return prototypeDetail();};
async function hydrateRealRuns(){
  if(!bridge())return;
  const listed=await bridge().list_runs();
  if(!listed.ok)return;
  const realTargets=[];
  for(const run of listed.data){
    const forms=await bridge().list_forms(run.run_id);
    if(!forms.ok)continue;
    let realAttack=null,realPatch=null,attackCtx=null,patchCtx=null;
    for(const descriptor of forms.data){
      const loaded=await bridge().get_form(descriptor);
      if(!loaded.ok)continue;
      if(descriptor.kind==='attack'&&!realAttack){realAttack=loaded.data.data;attackCtx=loaded.data.context;}
      if(descriptor.kind==='patch'&&!realPatch){realPatch=loaded.data.data;patchCtx=loaded.data.context;}
    }
    const cves=Object.keys(realAttack?.cves||{});
    const patchMap={};
    for(const [actionId,action] of Object.entries(realPatch?.actions||{}))for(const cve of action.target_cves||[])if(!patchMap[cve])patchMap[cve]=actionId;
    if(!cves.length&&realPatch)cves.push(...Object.keys(patchMap));
    realTargets.push({name:run.run_id,image:run.image,attack:realAttack||{run_id:run.run_id,cves:{}},patch:realPatch||{actions:{}},caseCves:cves,patchMap,source:run.status,attackCtx,patchCtx});
  }
  targets=realTargets;
  if(targets.length){targetIndex=0;attack=targets[0].attack;patch=targets[0].patch;attackContext=targets[0].attackCtx;patchContext=targets[0].patchCtx;cveKey=targets[0].caseCves[0]||'';}
  root.querySelector('header span').textContent='โหมดในเครื่อง · ข้อมูลจริง';
  render();
}
root.addEventListener('click',async e=>{const button=e.target.closest('button');if(!button||!bridge())return;
  if(button.id==='attack-yaml'&&attackContext){e.stopImmediatePropagation();const dumped=await bridge().dump_yaml({data:attack});if(dumped.ok){attackDrawer=true;attackDraft=dumped.data;formError='';render();}else{formError=dumped.error.message;render();}return;}
  if(button.id==='patch-yaml'&&patchContext){e.stopImmediatePropagation();const dumped=await bridge().dump_yaml({data:patch});if(dumped.ok){patchDrawer=true;patchDraft=dumped.data;formError='';render();}else{formError=dumped.error.message;render();}return;}
  if(button.dataset.openRun!==undefined){setTimeout(()=>{attackContext=targets[targetIndex].attackCtx;patchContext=targets[targetIndex].patchCtx;},0);return;}
  if(button.id==='confirm'&&patchContext){e.stopImmediatePropagation();const saved=await bridge().submit_form({...patchContext,data:patch,is_mock:false});formError=saved.ok?'ส่ง Patch Form เข้า pipeline แล้ว':saved.error.message;render();return;}
  if(button.id==='apply-attack'&&attackContext){e.stopImmediatePropagation();const result=await bridge().apply_yaml({...attackContext,yaml:attackDraft,is_mock:false});if(result.ok){attack=result.data.data;targets[targetIndex].attack=attack;attackContext=result.data.context;formError='ตรวจสอบ YAML ผ่านและบันทึก draft แล้ว';}else formError=result.error.message;render();return;}
  if(button.id==='apply-patch'&&patchContext){e.stopImmediatePropagation();const result=await bridge().apply_yaml({...patchContext,yaml:patchDraft,is_mock:false});if(result.ok){patch=result.data.data;targets[targetIndex].patch=patch;patchContext=result.data.context;formError='ตรวจสอบ YAML ผ่านและบันทึก draft แล้ว';}else formError=result.error.message;render();return;}
},true);
root.addEventListener('submit',async e=>{if(e.target.id!=='new-job'||!bridge())return;e.preventDefault();
  const image=e.target.elements.image?.value?.trim();
  const reply=await bridge().start_scan(image);
  if(!reply.ok){message=reply.error.message;return render();}
  message='เริ่มวิเคราะห์แล้ว · กำลังเตรียมผลลัพธ์';
  const jobId=reply.data.job_id;
  const waitForJob=async()=>{const current=await bridge().get_job(jobId);if(!current.ok){message=current.error.message;return render();}if(current.data.status==='RUNNING'||current.data.status==='QUEUED'){setTimeout(waitForJob,700);return;}if(current.data.status==='FAILED'){message=current.data.error||'งานวิเคราะห์ไม่สำเร็จ';return render();}await hydrateRealRuns();page='detail';message='';render();};
  waitForJob();render();
},true);
window.addEventListener('pywebviewready',hydrateRealRuns);
setTimeout(hydrateRealRuns,350);
if(bridge())targets=[];
render();})();
</script>
