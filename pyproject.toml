[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalama-mvp"
version = "0.1.0"
description = "VIPER — Vulnerability Inspection, Patching, and Exploit Retesting for Container Images"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[project.scripts]
kalama = "kalama.cli:main"
viper = "kalama.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "resolver",
  "resolver_core",
  "resolver_models",
  "resolver_config",
  "resolver_config_models",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kalama*"]
