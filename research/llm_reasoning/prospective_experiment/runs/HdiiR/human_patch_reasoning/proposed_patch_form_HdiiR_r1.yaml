actions:
  patch-001:
    target_cves:
    - CVE-2017-5638
    package:
      name: org.apache.struts:struts2-core
      ecosystem: jar
      before_versions:
      - 2.3.1
      scanner_fixed_versions:
      - 2.3.32
      - 2.5.10.1
    input_reasons:
    - ARTIFACT_SOURCE_UNRESOLVED
    fix_type:
      suggested: B
      confirmed: B
    target_version:
      scanner_candidates:
      - 2.3.32
      - 2.5.10.1
      suggested: 2.3.32
      confirmed: 2.3.32
    artifact:
      suggested_source: null
      confirmed_source: https://archive.apache.org/dist/struts/2.3.32/struts-2.3.32-lib.zip
      checksum:
        suggested: null
        confirmed: sha256:72301c03b11d460130b05632e382d03d7e9b8f52a42d23c70452c7d49dc29bdb
    strategy:
      suggested: PREBUILT_IMAGE_REPLACEMENT
      confirmed: HUMAN_COMMAND
    command:
      confirmed: |
        set -eu
        ROOT=/tmp/kalama-HdiiR
        mkdir -p "$ROOT"
        cat > "$ROOT/kalama-struts-upgrade.sh" <<'KALAMA_HELPER'
        #!/bin/sh
        set -eu
        VERSION=$1
        EXPECTED_SHA256=$2
        shift 2
        case "$VERSION" in
          2.3.32|2.3.34|2.5.10.1) ;;
          *) echo "unsupported Struts version: $VERSION" >&2; exit 64 ;;
        esac
        ROOT=/tmp/kalama-HdiiR
        STAGE="$ROOT/$VERSION"
        ARCHIVE="$STAGE/struts-$VERSION-lib.zip"
        DIST="$STAGE/struts-$VERSION/lib"
        mkdir -p "$STAGE"
        if [ ! -f "$ARCHIVE" ]; then
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            "https://archive.apache.org/dist/struts/$VERSION/struts-$VERSION-lib.zip" \
            -o "$ARCHIVE"
        fi
        printf '%s  %s\n' "$EXPECTED_SHA256" "$ARCHIVE" | sha256sum -c -
        if [ ! -d "$DIST" ]; then
          unzip -q "$ARCHIVE" -d "$STAGE"
        fi
        test -d "$DIST"

        for APP in "$@"; do
          WEBAPPS=/usr/local/tomcat/webapps
          WAR="$WEBAPPS/$APP.war"
          DIR="$WEBAPPS/$APP"
          if [ ! -d "$DIR" ]; then
            test -f "$WAR"
            mkdir -p "$DIR"
            unzip -q "$WAR" -d "$DIR"
          fi
          LIB="$DIR/WEB-INF/lib"
          test -d "$LIB"

          replace_family() {
            PATTERN=$1
            SOURCE_NAME=$2
            test -f "$DIST/$SOURCE_NAME"
            install -m 0644 "$DIST/$SOURCE_NAME" "$LIB/$SOURCE_NAME"
            find "$LIB" -maxdepth 1 -type f -name "$PATTERN" ! -name "$SOURCE_NAME" -delete
          }

          HAD_REST=false
          for EXISTING in "$LIB"/struts2-rest-plugin-*.jar; do
            if [ -e "$EXISTING" ]; then HAD_REST=true; fi
          done

          for EXISTING in "$LIB"/struts2-*.jar; do
            [ -e "$EXISTING" ] || continue
            NAME=$(basename "$EXISTING")
            ARTIFACT=${NAME%-[0-9]*.jar}
            SOURCE_NAME="$ARTIFACT-$VERSION.jar"
            test -f "$DIST/$SOURCE_NAME"
            install -m 0644 "$DIST/$SOURCE_NAME" "$LIB/$SOURCE_NAME"
            find "$LIB" -maxdepth 1 -type f -name "$ARTIFACT-*.jar" ! -name "$SOURCE_NAME" -delete
          done

          case "$VERSION" in
            2.3.32)
              replace_family 'commons-fileupload-*.jar' 'commons-fileupload-1.3.2.jar'
              replace_family 'commons-io-*.jar' 'commons-io-2.2.jar'
              replace_family 'commons-lang3-*.jar' 'commons-lang3-3.2.jar'
              replace_family 'commons-logging-*.jar' 'commons-logging-1.1.3.jar'
              replace_family 'freemarker-*.jar' 'freemarker-2.3.22.jar'
              replace_family 'javassist-*.jar' 'javassist-3.11.0.GA.jar'
              replace_family 'ognl-*.jar' 'ognl-3.0.19.jar'
              replace_family 'xwork-core-*.jar' 'xwork-core-2.3.32.jar'
              ;;
            2.3.34)
              replace_family 'commons-fileupload-*.jar' 'commons-fileupload-1.3.2.jar'
              replace_family 'commons-io-*.jar' 'commons-io-2.2.jar'
              replace_family 'commons-lang3-*.jar' 'commons-lang3-3.2.jar'
              replace_family 'commons-logging-*.jar' 'commons-logging-1.1.3.jar'
              replace_family 'freemarker-*.jar' 'freemarker-2.3.22.jar'
              replace_family 'javassist-*.jar' 'javassist-3.11.0.GA.jar'
              replace_family 'ognl-*.jar' 'ognl-3.0.21.jar'
              replace_family 'xwork-core-*.jar' 'xwork-core-2.3.34.jar'
              if [ "$HAD_REST" = true ]; then
                replace_family 'xstream-*.jar' 'xstream-1.4.10.jar'
              fi
              ;;
            2.5.10.1)
              replace_family 'commons-fileupload-*.jar' 'commons-fileupload-1.3.2.jar'
              replace_family 'commons-io-*.jar' 'commons-io-2.4.jar'
              replace_family 'commons-lang3-*.jar' 'commons-lang3-3.4.jar'
              replace_family 'freemarker-*.jar' 'freemarker-2.3.23.jar'
              replace_family 'javassist-*.jar' 'javassist-3.20.0-GA.jar'
              replace_family 'log4j-api-*.jar' 'log4j-api-2.7.jar'
              replace_family 'ognl-*.jar' 'ognl-3.1.12.jar'
              find "$LIB" -maxdepth 1 -type f -name 'xwork-core-*.jar' -delete
              ;;
          esac

          test -f "$LIB/struts2-core-$VERSION.jar"
          rm -f "$WAR"
          rm -rf "/usr/local/tomcat/work/Catalina/localhost/$APP"
        done
        KALAMA_HELPER
        chmod 0700 "$ROOT/kalama-struts-upgrade.sh"
        "$ROOT/kalama-struts-upgrade.sh" 2.3.32 \
          72301c03b11d460130b05632e382d03d7e9b8f52a42d23c70452c7d49dc29bdb \
          S2-009
    validation_command:
      confirmed: |
        set -eu
        ROOT=/tmp/kalama-HdiiR

        same_as_dist() {
          APP=$1
          VERSION=$2
          FILE=$3
          LIB="/usr/local/tomcat/webapps/$APP/WEB-INF/lib"
          DIST="$ROOT/$VERSION/struts-$VERSION/lib"
          test -f "$LIB/$FILE"
          test -f "$DIST/$FILE"
          test "$(sha256sum "$LIB/$FILE" | awk '{print $1}')" = \
               "$(sha256sum "$DIST/$FILE" | awk '{print $1}')"
        }

        check_app() {
          APP=$1
          VERSION=$2
          LIB="/usr/local/tomcat/webapps/$APP/WEB-INF/lib"
          DIST="$ROOT/$VERSION/struts-$VERSION/lib"
          test -d "$LIB"
          test ! -e "/usr/local/tomcat/webapps/$APP.war"
          same_as_dist "$APP" "$VERSION" "struts2-core-$VERSION.jar"
          for JAR in "$LIB"/struts2-*.jar; do
            [ -e "$JAR" ] || continue
            NAME=$(basename "$JAR")
            ARTIFACT=${NAME%-[0-9]*.jar}
            test "$NAME" = "$ARTIFACT-$VERSION.jar"
            same_as_dist "$APP" "$VERSION" "$NAME"
          done
          case "$VERSION" in
            2.3.32)
              for FILE in commons-fileupload-1.3.2.jar commons-io-2.2.jar \
                commons-lang3-3.2.jar commons-logging-1.1.3.jar \
                freemarker-2.3.22.jar javassist-3.11.0.GA.jar \
                ognl-3.0.19.jar xwork-core-2.3.32.jar; do
                same_as_dist "$APP" "$VERSION" "$FILE"
              done
              ;;
            2.3.34)
              for FILE in commons-fileupload-1.3.2.jar commons-io-2.2.jar \
                commons-lang3-3.2.jar commons-logging-1.1.3.jar \
                freemarker-2.3.22.jar javassist-3.11.0.GA.jar \
                ognl-3.0.21.jar xwork-core-2.3.34.jar; do
                same_as_dist "$APP" "$VERSION" "$FILE"
              done
              ;;
            2.5.10.1)
              for FILE in commons-fileupload-1.3.2.jar commons-io-2.4.jar \
                commons-lang3-3.4.jar freemarker-2.3.23.jar \
                javassist-3.20.0-GA.jar log4j-api-2.7.jar ognl-3.1.12.jar; do
                same_as_dist "$APP" "$VERSION" "$FILE"
              done
              test -z "$(find "$LIB" -maxdepth 1 -type f -name 'xwork-core-*.jar' -print -quit)"
              ;;
          esac
        }

        check_app S2-009 2.3.32
        check_app S2-015 2.3.32
        check_app S2-016 2.3.32
        check_app S2-019 2.3.32
        check_app S2-029 2.3.32
        check_app S2-046 2.3.32
        check_app S2-032 2.3.34
        check_app S2-033 2.3.34
        check_app S2-037 2.3.34
        check_app S2-045 2.3.34
        check_app S2-052 2.3.34
        check_app S2-053 2.5.10.1

        for APP in S2-033 S2-037 S2-045 S2-052; do
          same_as_dist "$APP" 2.3.34 struts2-rest-plugin-2.3.34.jar
          same_as_dist "$APP" 2.3.34 xstream-1.4.10.jar
        done

        if find /usr/local/tomcat/webapps -type f \
          \( -name 'struts2-core-2.3.1.jar' -o -name 'struts2-core-2.3.14.2.jar' \
             -o -name 'struts2-core-2.3.15.1.jar' -o -name 'struts2-core-2.3.20.1.jar' \
             -o -name 'struts2-core-2.3.24.1.jar' -o -name 'struts2-core-2.3.30.jar' \
             -o -name 'struts2-core-2.5.10.jar' \
             -o -name 'struts2-rest-plugin-2.3.20.1.jar' \) -print -quit | grep -q .; then
          echo 'vulnerable Struts artifact remains' >&2
          exit 1
        fi

        LOG=/tmp/kalama-HdiiR-tomcat.log
        "$CATALINA_HOME/bin/catalina.sh" run >"$LOG" 2>&1 &
        PID=$!
        cleanup() {
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
        }
        trap cleanup EXIT HUP INT TERM
        N=0
        until curl --fail --silent --show-error http://127.0.0.1:8080/S2-045/ >/dev/null \
          && curl --fail --silent --show-error http://127.0.0.1:8080/S2-052/orders/3 >/dev/null; do
          N=$((N + 1))
          if [ "$N" -ge 30 ]; then
            cat "$LOG" >&2
            exit 1
          fi
          sleep 1
        done
        if grep -E 'NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError' "$LOG"; then
          cat "$LOG" >&2
          exit 1
        fi
        cleanup
        trap - EXIT HUP INT TERM
        rm -rf "$ROOT" "$LOG"
    execution_target: patch-workspace
    major_version_approved: null
    notes: >-
      Creates the bounded helper used by later actions, expands S2-009 if only its
      WAR exists, installs the coherent Struts 2.3.32 module/dependency set, then
      removes the duplicate WAR so Tomcat deploys the patched directory.

