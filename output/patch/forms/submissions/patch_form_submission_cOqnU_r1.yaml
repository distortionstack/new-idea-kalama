    artifact:
      suggested_source: null
      confirmed_source: https://repo.maven.apache.org/maven2/org/apache/struts/struts2-rest-plugin/2.5.13/struts2-rest-plugin-2.5.13.jar
      checksum:
        suggested: null
        confirmed: f43e8ea108811a2b9d54d342f4442cd9fdcb6a4e79ce488858477d7832a27a59
    strategy:
      suggested: PREBUILT_IMAGE_REPLACEMENT
      confirmed: HUMAN_COMMAND
    command:
      confirmed: |-
        set -eu
        webapps=/usr/local/tomcat/webapps
        root="$webapps/ROOT"
        war="$webapps/ROOT.war"
        artifact=/tmp/struts2-rest-plugin-2.5.13.jar
        curl -fsSL -o "$artifact" https://repo.maven.apache.org/maven2/org/apache/struts/struts2-rest-plugin/2.5.13/struts2-rest-plugin-2.5.13.jar
        echo "f43e8ea108811a2b9d54d342f4442cd9fdcb6a4e79ce488858477d7832a27a59  $artifact" | sha256sum -c -
        rm -rf "$root"
        mkdir -p "$root"
        unzip -q "$war" -d "$root"
        rm -f "$root/WEB-INF/lib/struts2-rest-plugin-2.5.12.jar"
        install -m 0644 "$artifact" "$root/WEB-INF/lib/struts2-rest-plugin-2.5.13.jar"
        rm -f "$artifact" "$war"
    validation_command:
      confirmed: |-
        set -eu
        root=/usr/local/tomcat/webapps/ROOT
        test -f "$root/WEB-INF/lib/struts2-rest-plugin-2.5.13.jar"
        test ! -e "$root/WEB-INF/lib/struts2-rest-plugin-2.5.12.jar"
        test ! -e /usr/local/tomcat/webapps/ROOT.war
        echo "f43e8ea108811a2b9d54d342f4442cd9fdcb6a4e79ce488858477d7832a27a59  $root/WEB-INF/lib/struts2-rest-plugin-2.5.13.jar" | sha256sum -c -
    execution_target: patch-workspace
    major_version_approved: null
    notes: Replaces the vulnerable REST plugin in the exploded ROOT application and removes ROOT.war to prevent Tomcat from redeploying the vulnerable archive.
